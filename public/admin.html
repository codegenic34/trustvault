<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustVault — Admin Audit Console</title>
  <meta name="description" content="TrustVault admin panel — cryptographic audit log and system monitoring" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Shared Design System -->
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .admin-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="app-header">
  <div class="app-header-inner" style="max-width: 1280px;">
    <div class="app-brand">
      <img src="/img/logo.svg" alt="TrustVault Logo" style="width: 30px; height: 30px;" />
      <span style="font-weight: 700; font-size: 1.15rem; letter-spacing: 0.08em; text-transform: uppercase;">TrustVault</span>
      <span class="badge badge-blocked" style="margin-left: 8px;">ADMIN</span>
    </div>
    <div class="app-nav">
      <a href="/dashboard.html" style="font-size: 0.85rem; color: var(--morning-sky);">Dashboard</a>
      <button id="logout-btn" class="btn-secondary">Sign out</button>
    </div>
  </div>
</header>

<main class="admin-container">

  <!-- Chain verify banner -->
  <div id="chain-banner" style="display: none; padding: 14px 18px; border-radius: var(--radius-md); font-size: 0.9rem; font-weight: 500; margin-bottom: 28px;"></div>

  <!-- Suspicious items section -->
  <section style="margin-bottom: 36px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
      <h2 style="font-size: 1.15rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 8px;">
        <span style="color: var(--accent-honey);">⚠</span> Suspicious Activity
      </h2>
      <button id="refresh-suspicious-btn" class="btn-secondary">Refresh</button>
    </div>
    <div id="suspicious-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;">
      <p style="color: var(--text-muted); font-size: 0.85rem;">Loading…</p>
    </div>
  </section>

  <!-- Audit log section -->
  <section>
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px;">
      <h2 style="font-size: 1.15rem; font-weight: 600; color: var(--text-main);">Audit Log</h2>
      <div class="filter-bar">
        <select id="filter-outcome" class="form-input" style="width: 140px; padding: 8px 12px;">
          <option value="">All outcomes</option>
          <option value="ALLOW">ALLOW</option>
          <option value="DENY">DENY</option>
        </select>
        <input type="text" id="filter-action" placeholder="Action…" maxlength="50" class="form-input" style="width: 130px; padding: 8px 12px;" />
        <input type="text" id="filter-actor" placeholder="Actor ID…" maxlength="10" class="form-input" style="width: 110px; padding: 8px 12px;" />
        <button id="audit-search-btn" class="btn-secondary">Filter</button>
        <button id="verify-btn" class="btn-primary" style="width: auto; padding: 8px 16px; font-size: 0.825rem;">
          🔗 Verify Chain
        </button>
      </div>
    </div>

    <!-- Table -->
    <div class="card" style="padding: 0; overflow: hidden;">
      <div class="data-table-wrap" style="border: none; border-radius: 0;">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width: 40px;">#</th>
              <th>Timestamp</th>
              <th>Actor</th>
              <th>Action</th>
              <th>Outcome</th>
              <th>Reason</th>
              <th>Detail</th>
              <th>Resource</th>
            </tr>
          </thead>
          <tbody id="audit-tbody">
            <tr><td colspan="8" style="text-align: center; color: var(--text-muted); padding: 24px;">Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div style="padding: 14px 20px; border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted);">
        <span id="page-info"></span>
        <div style="display: flex; gap: 8px;">
          <button id="prev-btn" class="btn-secondary" disabled>← Prev</button>
          <button id="next-btn" class="btn-secondary" disabled>Next →</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer (Rule 8) -->
  <footer class="auth-footer" style="margin-top: 60px;">
    TrustVault, Secure Document Sharing &amp; Access Management, &copy; 2026 TrustVault
  </footer>

</main>

<script src="/js/admin.js"></script>
</body>
</html>
