<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Crisp White and Morning Sky Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#CAE4DB"/>
      <stop offset="80%" stop-color="#7A9D96"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- White / Silver Precision Shield Gradient (Replaced thick blue with white) -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Inner Shield Depth -->
    <linearGradient id="innerShieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>

    <!-- Accent Honey Gradient -->
    <linearGradient id="honeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#DCAE1D"/>
    </linearGradient>
  </defs>

  <!-- Outer Vault Ring (Gleaming White & Silver) -->
  <circle cx="32" cy="32" r="30" stroke="url(#ringGrad)" stroke-width="2.25" stroke-opacity="0.95"/>
  <circle cx="32" cy="32" r="26" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 3"/>

  <!-- Vault Ring Notches (White & Honey Accents) -->
  <circle cx="32" cy="4" r="1.8" fill="#DCAE1D"/>
  <circle cx="51.8" cy="12.2" r="1.8" fill="#FFFFFF"/>
  <circle cx="60" cy="32" r="1.8" fill="#DCAE1D"/>
  <circle cx="51.8" cy="51.8" r="1.8" fill="#FFFFFF"/>
  <circle cx="32" cy="60" r="1.8" fill="#DCAE1D"/>
  <circle cx="12.2" cy="51.8" r="1.8" fill="#FFFFFF"/>
  <circle cx="4" cy="32" r="1.8" fill="#DCAE1D"/>
  <circle cx="12.2" cy="12.2" r="1.8" fill="#FFFFFF"/>

  <!-- Outer Shield Trim (White) -->
  <path d="M 32 11.5
           C 42.5 11.5 47.5 14.5 47.5 18.5
           C 47.5 34.5 39 46.5 32 50.5
           C 25 46.5 16.5 34.5 16.5 18.5
           C 16.5 14.5 21.5 11.5 32 11.5 Z"
        fill="url(#shieldGrad)"
        stroke="#FFFFFF"
        stroke-width="1"
        stroke-linejoin="round"/>

  <!-- Inner Shield Core -->
  <path d="M 32 13.5
           C 41 13.5 45.5 16 45.5 19.5
           C 45.5 33.5 38 44.5 32 48
           C 26 44.5 18.5 33.5 18.5 19.5
           C 18.5 16 23 13.5 32 13.5 Z"
        fill="url(#innerShieldGrad)"
        stroke="#FFFFFF"
        stroke-width="1"
        stroke-opacity="0.5"/>

  <!-- Precision Keyhole (Vault Center Core) -->
  <circle cx="32" cy="27" r="4.25" fill="url(#honeyGrad)"/>
  <path d="M 29.8 28.5 L 28.5 37.5 A 1 1 0 0 0 29.5 38.5 L 34.5 38.5 A 1 1 0 0 0 35.5 37.5 L 34.2 28.5 Z"
        fill="url(#honeyGrad)"/>
  <!-- Center Pin Dot (Pure White) -->
  <circle cx="32" cy="27" r="1.5" fill="#FFFFFF"/>
</svg>
