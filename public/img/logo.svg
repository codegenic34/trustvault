<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CAE4DB"/>
      <stop offset="50%" stop-color="#7A9D96"/>
      <stop offset="100%" stop-color="#CAE4DB"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151F30"/>
      <stop offset="100%" stop-color="#0B121E"/>
    </linearGradient>
    <linearGradient id="honeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3CA3E"/>
      <stop offset="100%" stop-color="#DCAE1D"/>
    </linearGradient>
  </defs>

  <!-- Outer Vault Ring -->
  <circle cx="32" cy="32" r="30" stroke="url(#ringGrad)" stroke-width="2.5" stroke-opacity="0.9"/>
  <circle cx="32" cy="32" r="26" stroke="#CAE4DB" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 3"/>

  <!-- Vault Ring Notches / Locking Bolts (8 Cardinal & Intercardinal Points) -->
  <circle cx="32" cy="4" r="1.75" fill="#DCAE1D"/>
  <circle cx="51.8" cy="12.2" r="1.75" fill="#CAE4DB"/>
  <circle cx="60" cy="32" r="1.75" fill="#DCAE1D"/>
  <circle cx="51.8" cy="51.8" r="1.75" fill="#CAE4DB"/>
  <circle cx="32" cy="60" r="1.75" fill="#DCAE1D"/>
  <circle cx="12.2" cy="51.8" r="1.75" fill="#CAE4DB"/>
  <circle cx="4" cy="32" r="1.75" fill="#DCAE1D"/>
  <circle cx="12.2" cy="12.2" r="1.75" fill="#CAE4DB"/>

  <!-- Shield Body -->
  <path d="M 32 12
           C 42 12 47 15 47 19
           C 47 34 39 46 32 50
           C 25 46 17 34 17 19
           C 17 15 22 12 32 12 Z"
        fill="url(#shieldGrad)"
        stroke="url(#ringGrad)"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Shield Inner Border Highlight -->
  <path d="M 32 15.5
           C 40 15.5 44 17.5 44 21
           C 44 32.5 37.5 42.5 32 46
           C 26.5 42.5 20 32.5 20 21
           C 20 17.5 24 15.5 32 15.5 Z"
        stroke="rgba(202, 228, 219, 0.2)"
        stroke-width="1"
        fill="none"/>

  <!-- Precision Keyhole (Vault Core) -->
  <!-- Top Chamber -->
  <circle cx="32" cy="27" r="4.25" fill="url(#honeyGrad)"/>
  <!-- Keyhole Slot -->
  <path d="M 29.8 28.5 L 28.5 37.5 A 1 1 0 0 0 29.5 38.5 L 34.5 38.5 A 1 1 0 0 0 35.5 37.5 L 34.2 28.5 Z"
        fill="url(#honeyGrad)"/>
  <!-- Center Pin Reflection Dot -->
  <circle cx="32" cy="27" r="1.5" fill="#101827"/>
</svg>
