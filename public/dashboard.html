<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustVault — Dashboard</title>
  <meta name="description" content="TrustVault dashboard — manage and access your documents securely" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Shared Design System -->
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .dashboard-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }
    .user-pill {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .search-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }
    .file-dropzone {
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      background: rgba(5, 10, 18, 0.4);
    }
  </style>
</head>
<body>

<!-- ── App Header ─────────────────────────────────────────────────────────── -->
<header class="app-header">
  <div class="app-header-inner">
    <div class="app-brand">
      <img src="/img/logo.svg" alt="TrustVault Logo" style="width: 30px; height: 30px;" />
      <span style="font-weight: 700; font-size: 1.15rem; letter-spacing: 0.08em; text-transform: uppercase;">TrustVault</span>
    </div>
    <div class="app-nav">
      <div class="user-pill">
        <span>Logged in as</span>
        <strong id="hdr-username" style="color: var(--text-main);"></strong>
        <span id="hdr-role" class="badge badge-neutral"></span>
      </div>
      <button id="logout-btn" class="btn-secondary">Sign out</button>
    </div>
  </div>
</header>

<!-- ── Main Dashboard ─────────────────────────────────────────────────────── -->
<main class="dashboard-container">

  <!-- Upload section (visible to owners only) -->
  <section id="upload-section" class="card" style="display: none; margin-bottom: 32px;">
    <h2 style="font-size: 1.1rem; font-weight: 600; color: var(--text-main); margin-bottom: 16px;">Upload Document</h2>
    <div id="upload-error" class="alert-banner alert-danger" style="display: none;"></div>
    <div id="upload-success" class="alert-banner alert-success" style="display: none;"></div>
    
    <form id="upload-form" style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;">
      <div style="flex: 1; min-width: 240px;">
        <label for="file-input" class="form-label">File (pdf, png, jpg, txt, docx — max 5 MB)</label>
        <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg,.txt,.docx" class="form-input" style="padding: 8px 12px;" />
      </div>
      <div style="width: 180px;">
        <label for="category-input" class="form-label">Category</label>
        <input type="text" id="category-input" maxlength="64" placeholder="e.g. finance" class="form-input" />
      </div>
      <button type="submit" id="upload-btn" class="btn-primary" style="width: auto; height: 42px; padding: 0 20px;">
        Upload
      </button>
    </form>
  </section>

  <!-- Search & filter -->
  <section style="margin-bottom: 24px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
      <h2 style="font-size: 1.15rem; font-weight: 600; color: var(--text-main);">Documents</h2>
    </div>
    
    <div class="search-bar">
      <input type="search" id="search-q" placeholder="Search name or category…" class="form-input" style="flex: 1; min-width: 200px;" />
      <input type="text" id="filter-category" placeholder="Category filter" class="form-input" style="width: 150px;" />
      <button id="search-btn" class="btn-secondary">Search</button>
      <button id="clear-btn" class="btn-secondary">Clear</button>
    </div>
  </section>

  <!-- Document list -->
  <div id="doc-list" style="display: flex; flex-direction: column; gap: 12px;">
    <p style="color: var(--text-muted); font-size: 0.9rem;">Loading documents…</p>
  </div>

  <!-- Footer (Rule 8) -->
  <footer class="auth-footer" style="margin-top: 60px;">
    TrustVault, Secure Document Sharing &amp; Access Management, &copy; 2026 TrustVault
  </footer>

</main>

<!-- ── Permissions Modal ──────────────────────────────────────────────────── -->
<div id="modal-backdrop" class="modal-backdrop" style="display: none;">
  <div class="modal-card">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;">
      <h3 style="font-size: 1.1rem; font-weight: 600; color: var(--text-main);">Manage Permissions</h3>
      <button id="modal-close" style="background: none; color: var(--text-muted); font-size: 1.5rem; line-height: 1; cursor: pointer;">&times;</button>
    </div>

    <div>
      <div style="margin-bottom: 20px;">
        <h4 style="font-size: 0.85rem; font-weight: 500; color: var(--morning-sky); margin-bottom: 10px;">Grant Access</h4>
        <div id="grant-error" class="alert-banner alert-danger" style="display: none; padding: 8px 12px; margin-bottom: 10px;"></div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
          <input type="text" id="grant-username" placeholder="Username" maxlength="64" class="form-input" style="flex: 1; min-width: 140px;" />
          <label style="display: flex; align-items: center; gap: 6px; font-size: 0.825rem; color: var(--text-main); cursor: pointer;">
            <input type="checkbox" id="grant-can-read" checked /> Read
          </label>
          <label style="display: flex; align-items: center; gap: 6px; font-size: 0.825rem; color: var(--text-main); cursor: pointer;">
            <input type="checkbox" id="grant-can-edit" /> Edit
          </label>
          <button id="grant-btn" class="btn-primary" style="width: auto; padding: 8px 16px;">
            Grant
          </button>
        </div>
      </div>

      <div>
        <h4 style="font-size: 0.85rem; font-weight: 500; color: var(--morning-sky); margin-bottom: 10px;">Current Permissions</h4>
        <div id="perms-list" style="display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto;">
          <p style="color: var(--text-muted); font-size: 0.85rem;">Loading…</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── Edit Metadata Modal ─────────────────────────────────────────────────── -->
<div id="edit-modal-backdrop" class="modal-backdrop" style="display: none;">
  <div class="modal-card" style="max-width: 440px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;">
      <h3 style="font-size: 1.1rem; font-weight: 600; color: var(--text-main);">Edit Metadata</h3>
      <button id="edit-modal-close" style="background: none; color: var(--text-muted); font-size: 1.5rem; line-height: 1; cursor: pointer;">&times;</button>
    </div>
    
    <div id="edit-error" class="alert-banner alert-danger" style="display: none; padding: 8px 12px; margin-bottom: 12px;"></div>
    
    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <label for="edit-name" class="form-label">File name</label>
        <input type="text" id="edit-name" maxlength="255" class="form-input" />
      </div>
      <div>
        <label for="edit-category" class="form-label">Category</label>
        <input type="text" id="edit-category" maxlength="64" class="form-input" />
      </div>
      <button id="edit-save-btn" class="btn-primary">
        Save Changes
      </button>
    </div>
  </div>
</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
