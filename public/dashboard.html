<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustVault — Dashboard</title>
  <meta name="description" content="TrustVault dashboard — manage and access your documents" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Shared Design System -->
  <link rel="stylesheet" href="/css/style.css" />

  <!-- Tailwind for original document cards, badges, and modals -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px);} to {opacity:1;transform:none;} }
    #modal-backdrop { transition: opacity 0.2s; }
  </style>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen">

<!-- ── App Header (Top Left Logo + Brand + Tagline Underneath) ─────────────── -->
<header class="app-header">
  <div class="app-header-inner">
    <div class="app-brand">
      <img src="/img/logo.svg" alt="TrustVault Logo" class="brand-logo" />
      <div class="brand-text-block">
        <span class="brand-title">TRUSTVAULT</span>
        <span class="brand-tagline">Secure Document Sharing &amp; Access Management</span>
      </div>
    </div>

    <!-- Header Right: Welcome, username as signin -->
    <div class="app-user-section">
      <div class="welcome-box">
        <span class="welcome-text">Welcome, <strong id="hdr-username" class="welcome-username text-white"></strong></span>
        <span class="signin-pill">
          <span class="signin-dot"></span>Signed In (<span id="hdr-role"></span>)
        </span>
      </div>
      <a href="/settings.html" id="settings-link" class="btn-secondary" style="text-decoration: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 0.85rem;" title="Account Settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>Settings</span>
      </a>
      <button id="logout-btn" class="btn-secondary">Sign out</button>
    </div>
  </div>
</header>

<!-- ── Main ────────────────────────────────────────────────────────────────── -->
<main class="max-w-6xl mx-auto px-4 py-8">

  <!-- Upload section (visible to owners only) -->
  <section id="upload-section" class="hidden mb-8">
    <h2 class="text-lg font-semibold text-white mb-4">Upload Document</h2>
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
      <div id="upload-error" class="hidden mb-4 p-3 rounded-lg bg-red-950 border border-red-700 text-red-300 text-sm"></div>
      <div id="upload-success" class="hidden mb-4 p-3 rounded-lg bg-green-950 border border-green-700 text-green-300 text-sm"></div>
      <form id="upload-form" class="flex flex-wrap gap-4 items-end">
        <div class="flex-1 min-w-48">
          <label for="file-input" class="block text-xs font-medium text-gray-400 mb-1">File (pdf, png, jpg, txt, docx — max 5 MB)</label>
          <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg,.txt,.docx"
            class="w-full text-sm text-gray-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg
                   file:border-0 file:bg-blue-600 file:text-white file:cursor-pointer
                   file:hover:bg-blue-500 transition" />
        </div>
        <div class="w-40">
          <label for="category-input" class="block text-xs font-medium text-gray-400 mb-1">Category</label>
          <input type="text" id="category-input" maxlength="64" placeholder="e.g. finance"
            class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-xl text-sm text-white
                   placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <button type="submit" id="upload-btn"
          class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl
                 transition-colors disabled:opacity-50 text-sm">
          Upload
        </button>
      </form>
    </div>
  </section>

  <!-- Search & filter -->
  <section class="mb-6">
    <h2 class="text-lg font-semibold text-white mb-4">Documents</h2>
    <div class="flex flex-wrap gap-3 mb-4">
      <input type="search" id="search-q" placeholder="Search name or category…"
        class="flex-1 min-w-48 px-4 py-2 bg-gray-900 border border-gray-800 rounded-xl text-sm text-white
               placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <input type="text" id="filter-category" placeholder="Category filter"
        class="w-36 px-3 py-2 bg-gray-900 border border-gray-800 rounded-xl text-sm text-white
               placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <button id="search-btn"
        class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-sm rounded-xl transition-colors">
        Search
      </button>
      <button id="clear-btn"
        class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-sm rounded-xl transition-colors">
        Clear
      </button>
    </div>
  </section>

  <!-- Document list -->
  <div id="doc-list" class="space-y-3">
    <p class="text-gray-500 text-sm">Loading documents…</p>
  </div>

</main>

<!-- ── Permissions Modal ──────────────────────────────────────────────────── -->
<div id="modal-backdrop" class="fixed inset-0 bg-black/70 z-40 hidden flex items-center justify-center p-4">
  <div class="bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl w-full max-w-lg max-h-[80vh] flex flex-col">
    <div class="flex items-center justify-between p-5 border-b border-gray-800">
      <h3 class="font-semibold text-white">Manage Permissions</h3>
      <button id="modal-close" class="text-gray-400 hover:text-white text-xl leading-none">&times;</button>
    </div>

    <div class="overflow-y-auto flex-1 p-5 space-y-6">
      <!-- Grant form -->
      <div>
        <h4 class="text-sm font-medium text-gray-300 mb-3">Grant Access</h4>
        <div id="grant-error" class="hidden mb-3 p-2 rounded bg-red-950 border border-red-700 text-red-300 text-xs"></div>
        <div class="flex gap-2 flex-wrap">
          <input type="text" id="grant-username" placeholder="Username" maxlength="64"
            class="flex-1 min-w-32 px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm text-white
                   placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <label class="flex items-center gap-1.5 text-sm text-gray-300 cursor-pointer">
            <input type="checkbox" id="grant-can-read" checked class="rounded" /> Read
          </label>
          <label class="flex items-center gap-1.5 text-sm text-gray-300 cursor-pointer">
            <input type="checkbox" id="grant-can-edit" class="rounded" /> Edit
          </label>
          <button id="grant-btn"
            class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded-lg transition-colors">
            Grant
          </button>
        </div>
      </div>

      <!-- Existing permissions list -->
      <div>
        <h4 class="text-sm font-medium text-gray-300 mb-3">Current Permissions</h4>
        <div id="perms-list" class="space-y-2 text-sm">
          <p class="text-gray-500">Loading…</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── Edit Metadata Modal ─────────────────────────────────────────────────── -->
<div id="edit-modal-backdrop" class="fixed inset-0 bg-black/70 z-40 hidden flex items-center justify-center p-4">
  <div class="bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl w-full max-w-md p-6">
    <div class="flex items-center justify-between mb-5">
      <h3 class="font-semibold text-white">Edit Metadata</h3>
      <button id="edit-modal-close" class="text-gray-400 hover:text-white text-xl leading-none">&times;</button>
    </div>
    <div id="edit-error" class="hidden mb-4 p-2 rounded bg-red-950 border border-red-700 text-red-300 text-xs"></div>
    <div class="space-y-4">
      <div>
        <label for="edit-name" class="block text-xs font-medium text-gray-400 mb-1">File name</label>
        <input type="text" id="edit-name" maxlength="255"
          class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-xl text-sm text-white
                 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label for="edit-category" class="block text-xs font-medium text-gray-400 mb-1">Category</label>
        <input type="text" id="edit-category" maxlength="64"
          class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-xl text-sm text-white
                 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <button id="edit-save-btn"
        class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl transition-colors text-sm">
        Save Changes
      </button>
    </div>
  </div>
</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
