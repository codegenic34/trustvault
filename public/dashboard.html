<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustVault — Secure Dashboard</title>
  <meta name="description" content="TrustVault dashboard — secure document sharing and granular access management" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Shared Design System -->
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="dashboard-page">

<!-- ── App Header (Top Left Logo + Brand + Tagline Underneath) ─────────────── -->
<header class="app-header">
  <div class="app-header-inner">
    <div class="app-brand">
      <img src="/img/logo.svg" alt="TrustVault Logo" class="brand-logo" />
      <div class="brand-text-block">
        <span class="brand-title">TrustVault</span>
        <span class="brand-tagline">Secure Document Sharing &amp; Access Management</span>
      </div>
    </div>

    <!-- Header Right: Welcome, username as signin -->
    <div class="app-user-section">
      <div class="welcome-box">
        <span class="welcome-text">Welcome, <strong id="hdr-username" class="welcome-username"></strong></span>
        <span class="signin-pill">
          <span class="signin-dot"></span>Signed In (<span id="hdr-role"></span>)
        </span>
      </div>
      <button id="logout-btn" class="btn-secondary">Sign out</button>
    </div>
  </div>
</header>

<!-- ── Main Dashboard ─────────────────────────────────────────────────────── -->
<main class="dashboard-container">

  <!-- Upload Section (Visible to owners only) -->
  <section id="upload-section" class="card hidden" style="margin-bottom: 32px;">
    <h2 style="font-size: 1.15rem; font-weight: 700; color: #FFFFFF; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
      <span>📤</span> Upload Document
    </h2>
    <div id="upload-error" class="alert-banner alert-danger" style="display: none;"></div>
    <div id="upload-success" class="alert-banner alert-success" style="display: none;"></div>

    <form id="upload-form" style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;">
      <div style="flex: 1; min-width: 240px;">
        <label for="file-input" class="form-label">File (pdf, png, jpg, txt, docx — max 5 MB)</label>
        <input
          type="file"
          id="file-input"
          accept=".pdf,.png,.jpg,.jpeg,.txt,.docx"
          class="form-input"
          style="padding: 8px 12px;"
        />
      </div>
      <div style="width: 200px;">
        <label for="category-input" class="form-label">Category</label>
        <input
          type="text"
          id="category-input"
          maxlength="64"
          placeholder="e.g. finance, legal"
          class="form-input"
        />
      </div>
      <button type="submit" id="upload-btn" class="btn-primary" style="width: auto; height: 42px; padding: 0 24px;">
        Upload
      </button>
    </form>
  </section>

  <!-- Search & Filter Section -->
  <section style="margin-bottom: 24px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
      <h2 style="font-size: 1.2rem; font-weight: 700; color: #FFFFFF;">Documents</h2>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px;">
      <input
        type="search"
        id="search-q"
        placeholder="Search name or category…"
        class="form-input"
        style="flex: 1; min-width: 220px;"
      />
      <input
        type="text"
        id="filter-category"
        placeholder="Category filter"
        class="form-input"
        style="width: 160px;"
      />
      <button id="search-btn" class="btn-secondary">Search</button>
      <button id="clear-btn" class="btn-secondary">Clear</button>
    </div>
  </section>

  <!-- Document List Container -->
  <div id="doc-list" style="display: flex; flex-direction: column; gap: 12px;">
    <p style="color: var(--text-muted); font-size: 0.9rem;">Loading documents…</p>
  </div>

  <!-- Standardized Footer -->
  <footer class="auth-footer" style="margin-top: 64px;">
    TrustVault, Secure Document Sharing &amp; Access Management, &copy; 2026 TrustVault
  </footer>

</main>

<!-- ── Permissions Modal ──────────────────────────────────────────────────── -->
<div id="modal-backdrop" class="modal-backdrop hidden">
  <div class="modal-card">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 14px;">
      <h3 style="font-size: 1.15rem; font-weight: 700; color: #FFFFFF;">Manage Permissions</h3>
      <button id="modal-close" style="background: none; color: var(--text-muted); font-size: 1.6rem; line-height: 1; cursor: pointer; border: none;">&times;</button>
    </div>

    <div>
      <div style="margin-bottom: 24px;">
        <h4 style="font-size: 0.85rem; font-weight: 600; color: #FFFFFF; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em;">Grant Access</h4>
        <div id="grant-error" class="alert-banner alert-danger" style="display: none; padding: 8px 12px; margin-bottom: 12px;"></div>
        
        <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
          <input
            type="text"
            id="grant-username"
            placeholder="Username"
            maxlength="64"
            class="form-input"
            style="flex: 1; min-width: 140px;"
          />
          <label style="display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #FFFFFF; cursor: pointer;">
            <input type="checkbox" id="grant-can-read" checked /> Read
          </label>
          <label style="display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #FFFFFF; cursor: pointer;">
            <input type="checkbox" id="grant-can-edit" /> Edit
          </label>
          <button id="grant-btn" class="btn-primary" style="width: auto; padding: 9px 18px; font-size: 0.85rem;">
            Grant
          </button>
        </div>
      </div>

      <div>
        <h4 style="font-size: 0.85rem; font-weight: 600; color: #FFFFFF; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em;">Current Permissions</h4>
        <div id="perms-list" style="display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto;">
          <p style="color: var(--text-muted); font-size: 0.85rem;">Loading…</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── Edit Metadata Modal ─────────────────────────────────────────────────── -->
<div id="edit-modal-backdrop" class="modal-backdrop hidden">
  <div class="modal-card" style="max-width: 450px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 14px;">
      <h3 style="font-size: 1.15rem; font-weight: 700; color: #FFFFFF;">Edit Metadata</h3>
      <button id="edit-modal-close" style="background: none; color: var(--text-muted); font-size: 1.6rem; line-height: 1; cursor: pointer; border: none;">&times;</button>
    </div>

    <div id="edit-error" class="alert-banner alert-danger" style="display: none; padding: 8px 12px; margin-bottom: 14px;"></div>

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <label for="edit-name" class="form-label">File name</label>
        <input type="text" id="edit-name" maxlength="255" class="form-input" />
      </div>
      <div>
        <label for="edit-category" class="form-label">Category</label>
        <input type="text" id="edit-category" maxlength="64" class="form-input" />
      </div>
      <button id="edit-save-btn" class="btn-primary" style="margin-top: 8px;">
        Save Changes
      </button>
    </div>
  </div>
</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
